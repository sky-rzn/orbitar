# ORBITAR — статика на orbitar.duckdns.org.
# Ставится в /etc/nginx/sites-available/orbitar.duckdns.org.
#
# Схема та же, что у остальных сайтов машины: сертификат выпускает certbot
# аутентификатором webroot (/var/www/acme), installer'а нет — ssl_* директивы
# написаны здесь руками, а перезагрузку nginx после продления делает общий
# хук /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh.

server {
    listen 80;
    listen [::]:80;
    server_name orbitar.duckdns.org;

    # Обновление сертификата webroot'ом — единственный путь по http.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name orbitar.duckdns.org;

    root /var/www/orbitar;
    index index.html;

    access_log /var/log/nginx/orbitar.access.log;
    error_log  /var/log/nginx/orbitar.error.log;

    # Движок — три текстовых файла на ~90 КБ, сжатие снимает с них около 70%.
    gzip on;
    gzip_types text/css application/javascript;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # В именах файлов нет хэшей, поэтому длинный кэш отдавал бы старую игру
    # после деплоя. no-cache — это не «не кэшировать», а «ревалидировать»:
    # браузер держит копию и по ETag в обычном случае получает 304.
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    ssl_certificate /etc/letsencrypt/live/orbitar.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbitar.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
